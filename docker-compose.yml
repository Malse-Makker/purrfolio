services:
  nginx:
    # Eigen build voor de Alpine-patches; zie nginx-image/Dockerfile.
    build: ./nginx-image
    container_name: purrfolio-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

