server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. These are defined only here at the server level so they
    # are inherited by every location below. Note: adding an `add_header` inside
    # a location would drop all inherited headers for that location, so the
    # caching locations below use the `expires` directive (which does not reset
    # header inheritance) instead of `add_header Cache-Control`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js)$ {
        expires 30d;
    }

    location ~* \.html$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
